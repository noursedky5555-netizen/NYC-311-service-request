[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing-analytics"
version = "1.0.0"
description = "PySpark analytics and term-deposit subscription modeling"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<4",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
